            <h1 style="margin-top: 60px;">Flip-Flop Circuit</h1>
            <p><i>About flip-flops.</i></p>


<body>

<script>
function flip(sw) {
  var pic;
  if (sw == 0) {
    pic = "input_2.png"
  } else {
    pic = "input_1.png"
  }
  document.getElementById('myImage1').src = pic;
}
</script>

<img id="myImage1" src="default.png" width="500" height="280">

<p>
<button style="padding: 12px 24px; font-size: 18px; border-radius: 6px;"type="button" onclick="flip(1)">Input 1</button>
<button style="padding: 12px 24px; font-size: 18px; margin-bottom: 50px; border-radius: 6px;"type="button" onclick="flip(0)">Input 2</button>
</p>


<h1 style="margin-top: 60px;">NOT GATE</h1>
            <p><i>About not gates.</i></p>

<script>
function not(sw) {
  var pic;
  if (sw == 0) {
    pic = "not_off.png";
  } else {
    pic = "not_on.png";
  }
  document.getElementById('myImage2').src = pic;
}
</script>

<img id="myImage2" src="not_off.png" width="500" height="280">

<p>
  <button style="padding: 12px 24px; font-size: 18px; border-radius: 6px;" type="button" onclick="not(1)">NOT ON</button>
  <button style="padding: 12px 24px; font-size: 18px; margin-bottom: 50px; border-radius: 6px;" type="button" onclick="not(0)">NOT OFF</button>
</p>

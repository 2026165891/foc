        <main class="content">
            
			<div class="converter-card">
        <h2>Hex to Binary</h2>
        
        <div class="form-group">
            <label for="hexInput">Enter Hex Value:</label>
            <input type="text" id="hexInput" placeholder="E.G. A1, FF, 3C">
        </div>

        <button class="convert-btn" onclick="convertHexToBinary()">Convert</button>

        <div class="form-group">
            <label>Binary Result:</label>
            <div id="binaryResult" class="result-box"></div>
        </div>
    </div>

    <script>
        function convertHexToBinary() {
            const hexValue = document.getElementById('hexInput').value.trim();
            const resultBox = document.getElementById('binaryResult');
            
            if (hexValue === '') {
                resultBox.textContent = '';
                return;
            }

            // Remove spaces or commas if user types them like the placeholder
            const cleanHex = hexValue.replace(/[\s,]/g, '');

            // Validate if it is a valid hex string
            if (!/^[0-9A-Fa-f]+$/.test(cleanHex)) {
                resultBox.textContent = 'Invalid Hexadecimal Value';
                resultBox.style.color = '#d63031';
                return;
            }

            resultBox.style.color = '#333333';
            let binaryResult = '';
            
            for (let i = 0; i < cleanHex.length; i++) {
                // Convert each hex character to its 4-digit binary representation
                let binaryChunk = parseInt(cleanHex[i], 16).toString(2);
                binaryResult += binaryChunk.padStart(4, '0') + ' ';
            }

            resultBox.textContent = binaryResult.trim();
        }

        // Allow pressing Enter to convert
        document.getElementById('hexInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                convertHexToBinary();
            }
        });
    </script>
